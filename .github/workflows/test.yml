name: Test

on:
  push:
    branches: [master, develop]
    paths:
      - 'app/src/**'
      - 'app/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'app/src/**'
      - 'app/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # macos-latest is the only runner this workflow uses, and the only one with a
      # real keychain daemon - `--include-ignored` keeps the real-keychain tests
      # (`#[ignore]`d so a plain `cargo test` never pops a macOS Keychain access
      # prompt) running here.
      - name: Run tests
        run: cargo test --verbose -- --include-ignored
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check
