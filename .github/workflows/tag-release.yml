name: Tag Release

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

jobs:
  tag-release:
    uses: pilgrimagesoftware/github-actions/.github/workflows/rust-tag-release.yaml@master
    with:
      release-branch: master
    secrets:
      PSW_CI_APP_ID: ${{ secrets.PSW_CI_APP_ID }}
      PSW_CI_PRIVATE_KEY: ${{ secrets.PSW_CI_PRIVATE_KEY }}
