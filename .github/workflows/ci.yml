name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libvulkan1 \
            libgtk-3-dev \
            mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      # `--include-ignored` keeps the real-keychain tests (`#[ignore]`d so a plain
      # `cargo test` never pops a macOS Keychain access prompt) running here, since
      # macOS is the only runner with a real keychain daemon to test against.
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked -- --include-ignored

      # The ubuntu-latest runner has repeatedly died mid-test-run ("lost communication
      # with the server") on this branch specifically, long before the base suite's own
      # pre-existing failures (keychain/pidfile, tracked separately) would surface. Bound
      # it with `timeout` so a future recurrence fails fast with output instead of burning
      # a 50-minute runner slot with no uploaded log.
      - name: Test
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          stdbuf -oL -eL timeout 300 cargo test --workspace --locked -- --test-threads=1 --nocapture 2>&1 | tee test-output.log
          code=$?
          if [ "$code" = "124" ]; then
            echo "::error::cargo test timed out after 300s; last lines of output:"
            tail -n 40 test-output.log
          fi
          exit "$code"
