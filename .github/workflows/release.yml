name: Release

permissions:
  contents: write
  # rust-release.yaml declares id-token: write unconditionally (for crates.io
  # OIDC trusted publishing), even though publish-to-crates-io is false here -
  # the caller must still grant it, or GitHub refuses to start the run.
  id-token: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: pilgrimagesoftware/github-actions/.github/workflows/rust-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      # ci.yml already runs the whole workspace on both Linux and macOS for
      # every push and PR; this re-runs that same suite against the tagged ref.
      test-args: "--workspace"
      publish-to-crates-io: false
      # The bare release runner lacks the GUI dev libraries ci.yml installs; without
      # them the pre-publish cargo test can't link (xcb, xkbcommon).
      linux-packages: >-
        libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev
        libvulkan1 libgtk-3-dev libsecret-1-dev mesa-vulkan-drivers
      release-branch: master
      merge-back-branch: develop
    secrets:
      PSW_CI_APP_ID: ${{ secrets.PSW_CI_APP_ID }}
      PSW_CI_PRIVATE_KEY: ${{ secrets.PSW_CI_PRIVATE_KEY }}

  # Packages Fernrohr for the released tag and attaches the installers to the
  # release the job above created.
  package:
    needs: release
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    secrets: inherit

  # Writes the released version and the DMG's checksum into the Homebrew tap's
  # `Casks/fernrohr.rb`, rendered from packaging/homebrew/fernrohr.rb.in. Needs
  # the `pilgrimagesoftware/homebrew-tap` repo and the PSW CI GitHub App
  # installed on it with contents: write.
  homebrew:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: Tap token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PSW_CI_APP_ID }}
          private-key: ${{ secrets.PSW_CI_PRIVATE_KEY }}
          owner: pilgrimagesoftware
          repositories: homebrew-tap

      - name: Render the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          sha=$(awk -v f="Fernrohr_${version}_aarch64.dmg" '$2 == f { print $1 }' SHA256SUMS)
          [ -n "$sha" ] || { echo "::error::no checksum for Fernrohr_${version}_aarch64.dmg"; exit 1; }
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" \
            packaging/homebrew/fernrohr.rb.in > tap/Casks/fernrohr.rb
          cat tap/Casks/fernrohr.rb

      - name: Push to the tap
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/pilgrimagesoftware/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Casks
          cp tap/Casks/fernrohr.rb tap-repo/Casks/fernrohr.rb
          cd tap-repo
          git config user.name "psw-ci[bot]"
          git config user.email "psw-ci[bot]@users.noreply.github.com"
          git add Casks/fernrohr.rb
          git diff --cached --quiet && { echo "cask already current"; exit 0; }
          git commit -m "chore(fernrohr): update to ${TAG#v}"
          git push
