name: Publish documentation

on:
  push:
    branches: [master]
    paths:
      - docs/site/**
      - .github/workflows/docs-pages.yml
  # No paths filter, so `docs-check` reports on every pull request and can be a
  # required status check; it skips the site check itself when nothing changed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests: check the site (a warning-free build, the version manifest
  # against the pages, and every internal link, via `_scripts/check.rb`) when the
  # PR changes `docs/**` or this workflow, and succeed with a note
  # otherwise. Named apart from CI's `build` so a ruleset can require it.
  docs-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes
      - name: Skip the site check
        if: steps.changes.outputs.docs-site != 'true'
        run: echo "No changes under docs/ or to docs-pages.yml; skipping the site check." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.changes.outputs.docs-site == 'true'
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: docs/site
      - name: Check the site
        if: steps.changes.outputs.docs-site == 'true'
        run: bundle exec ruby _scripts/check.rb
        working-directory: docs/site

  # Pushes to master and manual runs check the site first, then build with the
  # Pages base path, upload and deploy, so a failed check blocks the deploy.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: docs/site
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Check the site
        run: bundle exec ruby _scripts/check.rb
        working-directory: docs/site
      - name: Build for Pages
        if: github.event_name != 'pull_request'
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: docs/site
        env:
          JEKYLL_ENV: production
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
