name: Package

# Builds installable Fernrohr packages with cargo-packager for every platform
# ci.yml already tests (macOS, Linux).
#
# Runs on every merge into develop, keeping the result as a workflow artifact,
# and is called by release.yml with a tag, which also attaches the installers
# to the GitHub Release.

on:
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the packages to. Empty to only keep them as an artifact."
        type: string
        default: ""
      ref:
        description: "Git ref to build. Defaults to the ref that triggered the caller."
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# A merge into develop supersedes the build in flight for the one before it; a
# release build has its own group and is never cancelled.
concurrency:
  group: package-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache-key: package-${{ matrix.target }}

      - name: Install Linux packaging dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libvulkan1 \
            libgtk-3-dev \
            libsecret-1-dev \
            mesa-vulkan-drivers \
            desktop-file-utils \
            rpm

      - name: Validate desktop entry
        if: matrix.name == 'Linux'
        run: desktop-file-validate app/assets/linux/fernrohr.desktop

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Install cargo-generate-rpm
        if: matrix.name == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm

      # cargo-packager resolves `[package.metadata.packager]` from the manifest
      # in the current directory, not from a workspace root with `--packages`.
      - name: Package
        working-directory: app
        env:
          # macOS Developer ID signing/notarization credentials. While unset the
          # .app and dmg get the ad-hoc signature `app/Cargo.toml` configures.
          # cargo-packager reads the certificate and notarization values from
          # the environment, but the identity only from its config, so the
          # script below writes APPLE_SIGNING_IDENTITY into the manifest.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # A plain `cargo build` with no `--target` would write to
          # target/release while packaging looks under target/<triple>/release.
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          # A secret that isn't set still arrives as an empty variable, and
          # cargo-packager treats a present-but-empty APPLE_CERTIFICATE as a
          # certificate to import, which fails. Unset the empty ones.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          if [ "$RUNNER_OS" = macOS ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            perl -pi -e 's/^signing-identity = "-"$/signing-identity = "$ENV{APPLE_SIGNING_IDENTITY}"/' Cargo.toml
            grep -qxF "signing-identity = \"$APPLE_SIGNING_IDENTITY\"" Cargo.toml || {
              echo "::error::could not set the Developer ID identity in app/Cargo.toml"
              exit 1
            }
          fi
          cargo packager \
            --release \
            --target ${{ matrix.target }} \
            --formats ${{ matrix.formats }} \
            --verbose

      # Fails the job on a missing or broken signature, on the .app itself and
      # on the copy a user actually installs from the dmg. `--deep` here only
      # verifies nested code; signing never uses it.
      - name: Verify macOS signatures
        if: matrix.name == 'macOS'
        run: |
          set -euo pipefail
          out=target/${{ matrix.target }}/release
          app="$out/Fernrohr.app"
          dmg=$(ls "$out"/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          mnt=$(mktemp -d)
          # The dmg carries LICENSE.md as a license agreement, which hdiutil
          # pages and asks to accept; without the `yes` it cancels the attach.
          # Fed by process substitution, not a pipe: `yes` dies of SIGPIPE once
          # hdiutil stops reading, which `pipefail` would report as a failure.
          PAGER=cat hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" < <(yes) >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mnt/Fernrohr.app"
          codesign -dv "$mnt/Fernrohr.app"

      # cargo-packager writes `Depends` but has no `Recommends`, so the Secret
      # Service providers are added to the built deb's control file here, and the
      # result is read back - with the desktop entry and icon it should carry.
      - name: Finish and check deb
        if: matrix.name == 'Linux'
        run: |
          set -euo pipefail
          recommends="gnome-keyring | kwalletmanager | keepassxc"
          for deb in target/${{ matrix.target }}/release/*.deb; do
            work=$(mktemp -d)
            dpkg-deb -R "$deb" "$work"
            grep -q '^Recommends:' "$work/DEBIAN/control" \
              || echo "Recommends: $recommends" >> "$work/DEBIAN/control"
            dpkg-deb --root-owner-group -b "$work" "$deb"
            rm -rf "$work"

            depends=$(dpkg-deb -f "$deb" Depends)
            echo "Depends: $depends"
            for dep in openssh-client libsecret-1-0; do
              grep -qw -- "$dep" <<<"$depends" || { echo "::error::$deb doesn't depend on $dep"; exit 1; }
            done
            [ "$(dpkg-deb -f "$deb" Recommends)" = "$recommends" ] \
              || { echo "::error::$deb doesn't recommend $recommends"; exit 1; }

            contents=$(dpkg-deb -c "$deb")
            grep -q '/usr/share/pixmaps/fernrohr.png$' <<<"$contents" \
              || { echo "::error::$deb has no pixmaps icon"; exit 1; }
            entry=$(mktemp -d)
            dpkg-deb -x "$deb" "$entry"
            desktop=$(ls "$entry"/usr/share/applications/*.desktop)
            desktop-file-validate "$desktop"
            grep -qx 'StartupWMClass=fernrohr' "$desktop" \
              || { echo "::error::$deb's desktop entry isn't the checked-in one"; exit 1; }
            rm -rf "$entry"
          done

      # cargo-packager has no RPM backend: build the rpm from the release build
      # it just made, then read its requirements and recommendations back.
      - name: Build and check rpm
        if: matrix.name == 'Linux'
        run: |
          set -euo pipefail
          cargo generate-rpm -p app --target ${{ matrix.target }}
          shopt -s nullglob
          rpms=(target/${{ matrix.target }}/generate-rpm/*.rpm)
          [ ${#rpms[@]} -eq 1 ] || { echo "::error::expected one rpm, found ${#rpms[@]}"; exit 1; }
          rpm="${rpms[0]}"
          requires=$(rpm -qpR "$rpm")
          recommends=$(rpm -qp --recommends "$rpm")
          echo "Requires:"; echo "$requires"
          echo "Recommends:"; echo "$recommends"
          for dep in openssh-clients libsecret; do
            grep -qx -- "$dep" <<<"$requires" || { echo "::error::$rpm doesn't require $dep"; exit 1; }
          done
          grep -qx gnome-keyring <<<"$recommends" \
            || { echo "::error::$rpm doesn't recommend gnome-keyring"; exit 1; }
          files=$(rpm -qpl "$rpm")
          for file in /usr/bin/fernrohr /usr/share/applications/fernrohr.desktop \
            /usr/share/pixmaps/fernrohr.png /usr/share/licenses/fernrohr/LICENSE.md; do
            grep -qx -- "$file" <<<"$files" || { echo "::error::$rpm lacks $file"; exit 1; }
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fernrohr-${{ matrix.name }}-${{ github.run_number }}
          path: |
            target/${{ matrix.target }}/release/*.dmg
            target/${{ matrix.target }}/release/*.app
            target/${{ matrix.target }}/release/*.AppImage
            target/${{ matrix.target }}/release/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "${{ inputs.tag }}" \
            target/${{ matrix.target }}/release/*.dmg \
            target/${{ matrix.target }}/release/*.AppImage \
            target/${{ matrix.target }}/release/*.deb \
            target/${{ matrix.target }}/generate-rpm/*.rpm \
            --clobber
